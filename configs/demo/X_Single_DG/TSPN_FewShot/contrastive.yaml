# Contrastive few-shot domain generalisation configuration built on shared defaults.

__include__:
  - shared.yaml

environment:
  project: "tspn_contrastive_demo"
  output_dir: "results/tspn_contrastive_demo"
  notes: "Contrastive few-shot DG run for TSPN."
  iterations: 5
  swanlab: false

data:
  batch_size: &bs 32

model:
  name: "TSPNContrastive"
  contrastive:
    enabled: true
    projection_hidden: 0
    projection_dim: 0
    temperature: &contrastive_temp 0.2
    loss_weight: &contrastive_loss_weight 0.3
    mode: "supervised"
    physical_projector:
      enabled: true
      indicator_dim: 64
      init: "kaiming"
      sparsity_l1: 1.0e-4
      sparsity_group: 0.0
      prior:
        path: null
        format: "npy"
        temperature: 1.0
  mining:
    strategy: "domain"

task:
  name: "contrastive_classification"
  batch_size: *bs
  epochs: &num_epoch 100
  lr: 0.002
  es_patience: &es_patience 50
  step_size: 5
  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 4
    classes_per_domain: 5
    support_per_class: 3
    query_per_class: 10
    preserve_labels: true
    episodes_per_epoch: 10
    warn_on_shortfall: true
    format: "episode"
  contrastive:
    temperature: *contrastive_temp
    loss_weight: *contrastive_loss_weight
    normalize_embeddings: true
    support_loss:
      mode: "hybrid"
      loss_weight: 0.5
      ce_weight: 1.0
      prototype_weight: 0.5
      prototype_metric: "cosine"
      detach_prototypes: false
      log_prefix: "support"
    weighting:
      strategy: "gradnorm"
      alpha: 0.5
      ema: 0.9
      temperature: 1.0
  explainability:
    enabled: true
    output_subdir: "explainability"
    device: "auto"
    summary:
      top_k_features: 10
      save_embeddings: true
    attribution:
      method: "grad_cam"
      smooth: true
      samples: 32

trainer:
  name: "contrastive_trainer"
  num_epochs: *num_epoch
  patience: *es_patience
  logging:
    contrastive_metrics: true
  callbacks:
    checkpoint_monitor: "val_total_loss"
    checkpoint_mode: "min"
