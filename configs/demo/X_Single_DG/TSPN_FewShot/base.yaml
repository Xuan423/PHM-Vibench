# Base configuration for the revamped TSPN contrastive pipeline.

environment:
  VBENCH_HOME: "/home/xuanli/work/PHM-Vibench"
  PYTHONPATH: "/home/xuanli/miniforge/envs/phmbench"
  PHMBench: "/home/xuanli/work/PHM-Vibench"
  seed: 17
  project: "tspn_fewshot_base"
  output_dir: "results/tspn_fewshot_base"
  notes: "Single-phase TSPN contrastive training baseline."
  iterations: 1
  WANDB_MODE: "disabled"

data:
  data_dir: "/mnt/e/dataset/PHMbench-raw_data"
  metadata_file: "metadata_9_29.xlsx"
  batch_size: 64
  num_workers: 4
  train_ratio: 0.8
  window_size: 4096
  stride: 5
  truncate_lenth: 100
  dtype: float32
  num_window: 64
  normalization: "standardization"

model:
  name: "TSPNContrastive"
  type: "X_model"
  device: "cuda"
  reducer:
    dim: 64
  signal_processing_configs:
    layer1: ['LNO','WF','HT','I']
    layer2: ['LNO','WF','HT','I']
    layer3: ['LNO','WF','HT','I']
    layer4: ['LNO','WF','HT','I']
  feature_extractor_configs: ['Mean','Std','Var','Entropy','RMS','Kurtosis']
  skip_connection: true
  num_classes: 9
  in_dim: 4096
  out_dim: 4096
  in_channels: 3
  out_channels: 4
  scale: 4
  f_c_mu: 0.0
  f_c_sigma: 0.1
  f_b_mu: 0.0
  f_b_sigma: 0.1
  tspn:
    spd:
      eps: 1.0e-2
      momentum: 0.2
      block_size: 32
    projector:
      proj_dim: 64
      reorth_every: 10
    head:
      contrast_dim: 128
    prototype_memory:
      momentum: 0.99
      num_domains: 4
    loss:
      lambda_proto: 1.0
      lambda_var: 0.1
      lambda_ortho: 1.0e-3
      lambda_phys: 0.0
      temperature: 0.2

task:
  name: "contrastive_classification"
  type: "DG"
  target_system_id: [19]
  target_domain_id: [10]
  source_domain_id: [2, 3, 4]
  loss: "CE"
  metrics: ["acc"]
  batch_size: 64
  lr: 0.001
  epochs: 80
  optimizer: "adam"
  weight_decay: 0.0005
  scheduler: true
  scheduler_type: "step"
  step_size: 5
  gamma: 0.5

trainer:
  name: "Default_trainer"
  num_epochs: 80
  gpus: 1
  patience: 10
  early_stopping: true
  device: "cuda"
  monitor: "val_total_loss"
