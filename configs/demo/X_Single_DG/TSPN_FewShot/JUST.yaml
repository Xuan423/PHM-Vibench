# JUST scenario: enable few-shot TSPN DG towards system 18 / domain 9.

__include__:
  - base.yaml

environment:
  project: "tspn_fewshot_just"
  output_dir: "results/tspn_fewshot_just"
  notes: "Few-shot TSPN DG run targeting JUST system 18 domain 9."
  iterations: 1
  swanlab: false

data:
  batch_size: &bs 32

model:
  name: "TSPNContrastive"
  contrastive:
    enabled: true
    temperature: &contrastive_temp 0.2
    loss_weight: &contrastive_loss_weight 0.2
    reg_weight: 1.0e-4
    physical_projector:
      indicator_dim: 64
      init: "uniform"
      simplex_eps: 1.0e-6
      spd_rank: 4
      tau_init: 1.0
      tau_min: 1.0e-4
      prior:
        path: null
        format: "npy"
        temperature: 1.0
  mining:
    strategy: "domain"

task:
  name: "contrastive_classification"
  target_system_id: [18]
  target_domain_id: [2,4,6,8]
  source_domain_id: [1, 3, 5, 7, 9]
  batch_size: *bs  # Per-iteration query cap for episodic batching
  epochs: &num_epoch 100
  lr: 0.002
  es_patience: &es_patience 10
  step_size: 5
  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 4
    classes_per_domain: 4
    support_per_class: 3
    query_per_class: 10
    preserve_labels: true
    warn_on_shortfall: true
  contrastive:
    temperature: *contrastive_temp
    loss_weight: *contrastive_loss_weight
    reg_weight: 1.0e-4
    pcc:
      lambda_pos: 1.0
      lambda_neg: 1.1
      cos_threshold_deg: 25.0
      augmentation:
        enable_phi: true
        time_shift_pct: 0.05
        amplitude_min: 0.85
        amplitude_max: 1.15
        stretch_min: 0.95
        stretch_max: 1.05
        ripple_db: 2.0
        views_per_sample: 2

trainer:
  name: "contrastive_trainer"
  num_epochs: *num_epoch
  patience: *es_patience
  logging:
    contrastive_metrics: true
  callbacks:
    checkpoint_monitor: "val_total_loss"
    checkpoint_mode: "min"
