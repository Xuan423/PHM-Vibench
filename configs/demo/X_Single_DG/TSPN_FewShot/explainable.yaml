# Full pipeline example: contrastive TSPN with extended logging.

environment:
  WANDB_MODE: "disabled"
  VBENCH_HOME: "/home/xuanli/work/PHM-Vibench"
  PYTHONPATH: "/home/xuanli/miniforge/envs/phmbench"
  PHMBench: "/home/xuanli/work/PHM-Vibench"

  project: "tspn_explainable_demo"
  seed: 123
  output_dir: "results/tspn_explainable_demo"
  notes: "Contrastive few-shot TSPN run with attribution exports."
  iterations: 1

data:
  data_dir: "/mnt/e/dataset/PHMbench-raw_data"
  metadata_file: "metadata_6_1.xlsx"
  batch_size: &tspn_fs_bs 32  # Shared TSPN batch size anchor (used for episodic chunking)
  num_workers: 8
  train_ratio: 0.75
  normalization: 'standardization'
  window_size: 4096
  stride: 5
  truncate_lenth: 100
  dtype: float32
  num_window: 64

model:
  name: "TSPNContrastive"
  type: "X_model"
  device: cuda
  signal_processing_configs:
    layer1: ['LNO','WF','HT','I']
    layer2: ['LNO','WF','HT','I']
    layer3: ['LNO','WF','HT','I']
    layer4: ['LNO','WF','HT','I']
  feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']
  skip_connection: true
  num_classes: 9
  in_dim : 4096
  out_dim : 4096
  in_channels : 3
  out_channels : 4
  scale : 4

  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1

  contrastive:
    enabled: true
    temperature: 0.2
    loss_weight: 0.2
    physical_projector:
      indicator_dim: 64
      init: "uniform"
      simplex_eps: 1.0e-6
      spd_rank: 4
      tau_init: 1.0
      tau_min: 1.0e-4
      prior:
        path: null
        format: "npy"
        temperature: 1.0
    reg_weight: 1.0e-4

  mining:
    strategy: "domain"
    negative_pool: 128

task:
  name: "contrastive_classification"
  type: 'DG'
  target_domain_id: [10]
  source_domain_id: [0,1,2,3,4]
  loss: "CE"
  metrics: ["acc"]
  target_system_id: [19]

  optimizer: "adam"
  regularization: {'flag': True, 'method': {'l1': 0.0001}}

  batch_size: *tspn_fs_bs
  num_workers: 8
  pin_memory: true
  shuffle: true
  log_interval: 10
  epochs: 100
  lr: 0.002
  weight_decay: 0.0005
  early_stopping: true
  es_patience: 50
  scheduler: true
  scheduler_type: "step"
  step_size: 5
  gamma: 0.5

  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 4
    classes_per_domain: 4
    support_per_class: 3
    query_per_class: 10
    preserve_labels: true
    episodes_per_epoch: 10 # 200
    warn_on_shortfall: true
    format: "episode"
  contrastive:
    temperature: 0.2
    loss_weight: 0.2
    log_components: true
    reg_weight: 1.0e-4
    pcc:
      lambda_pos: 1.0
      lambda_neg: 1.1
      cos_threshold_deg: 22.0
      augmentation:
        enable_phi: true
        time_shift_pct: 0.05
        amplitude_min: 0.85
        amplitude_max: 1.15
        stretch_min: 0.95
        stretch_max: 1.05
        ripple_db: 2.0
        views_per_sample: 3

trainer:
  name: "Default_trainer"
  wandb: true
  pruning: false
  num_epochs: 100
  gpus: 1
  early_stopping: true
  patience: 50
  device: 'cuda'

  logging:
    contrastive_metrics: true

  callbacks:
    checkpoint_monitor: "val_total_loss"
    checkpoint_mode: "min"
