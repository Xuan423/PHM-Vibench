# Combined two-stage contrastive configuration for TSPN.

__include__:
  - shared.yaml

environment:
  project: "tspn_two_stage"
  output_dir: "results/tspn_two_stage"
  notes: "Stage 1: CE + projector; Stage 2: episodic prototype fine-tune."
  iterations: 1
  swanlab: false

data:
  batch_size: &bs 64

model:
  name: "TSPNContrastive"
  contrastive:
    enabled: true
    temperature: &contrastive_temp 0.2
    loss_weight: &contrastive_loss_weight 0.02
    physical_projector:
      indicator_dim: 64
      init: "uniform"
      simplex_eps: 1.0e-6
      spd_rank: 4
      tau_init: 1.0
      tau_min: 1.0e-4
      prior:
        path: null
        format: "npy"
        temperature: 1.0
    reg_weight: 1.0e-4
  mining:
    strategy: "domain"

task:
  name: "contrastive_classification"
  batch_size: *bs
  epochs: &num_epoch 200
  lr: 0.001
  es_patience: &es_patience 100
  step_size: 5
  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 4
    classes_per_domain: 4
    support_per_class: 4
    query_per_class: 8
    preserve_labels: true
    warn_on_shortfall: true
  contrastive:
    temperature: *contrastive_temp
    loss_weight: *contrastive_loss_weight
    reg_weight: 1.0e-4
    pcc:
      lambda_pos: 1.0
      lambda_neg: 1.2
      cos_threshold_deg: 25.0
      augmentation:
        enable_phi: true
        time_shift_pct: 0.05
        amplitude_min: 0.85
        amplitude_max: 1.15
        stretch_min: 0.95
        stretch_max: 1.05
        ripple_db: 2.0
        views_per_sample: 2

trainer:
  name: "contrastive_trainer"
  num_epochs: *num_epoch
  patience: *es_patience
  logging:
    contrastive_metrics: true
  callbacks:
    checkpoint_monitor: "val_total_loss"
    checkpoint_mode: "min"

pipeline:
  module: "pipelines.tspn_two_stage.pipeline"
  options:
    enable_stage1: false          # set false to skip Stage 1 and run Stage 2 only
    two_stage_mode: "auto"        # overridden automatically based on enable_stage1 unless CLI overrides
    stage1_checkpoint: "results/tspn_two_stage/stage1/iter_0/model-epoch=199-val_total_loss=0.0464.ckpt"  # path to the Stage 1 checkpoint
    projector_log_dir: null
  stage2_overrides:
    task:
      lr: 0.001
      optimizer: "adamw"
      scheduler:
        name: "cosine"
        options:
          T_max: 600
          eta_min: 5.0e-5
      warmup:
        enabled: true
        epochs: 10
        lr_scale_start: 0.05
        contrastive_scale_start: 0.05
        freeze_backbone_epochs: 1000
        freeze_projector_epochs: 0
        freeze_classifier_epochs: 0
        apply_flat_to_eval: true
      few_shot:
        enabled: true
        systems_per_episode: 1
        domains_per_system: 4
        classes_per_domain: 4
        support_per_class: 4
        query_per_class: 8
        episodes_per_epoch: 1
        preserve_labels: true
        warn_on_shortfall: true
      contrastive:
        temperature: *contrastive_temp
        loss_weight: 0.05
        reg_weight: 1.0e-4
        ce_weighting:
          mode: fixed
          weight: 0.95
        weight_anchor:
          enabled: true
          lambda: 0.0005
          modules:
            - physics_projector
            - spd_metric
        prototype_matching:
          enabled: true
          cache_dir: "save/prototypes/tspn_two_stage"
          prototypes_per_class_domain: 4
          max_positive_prototypes: 4
          max_negative_prototypes: 32
          fallback_strategy: "nearest"
          checkpoint_interval: 1
          update_on_eval: true
          augmentation:
            time_shift_pct: 0.05
            amplitude_min: 0.8
            amplitude_max: 1.2
            stretch_min: 0.95
            stretch_max: 1.05
            ripple_db: 2.0
            views_per_sample: 2
        pcc:
          max_positive_support_samples: 2
          max_negative_query_samples: 8
    trainer:
      num_epochs: 100
      patience: 50
