# Common configuration for TSPN few-shot/contrastive experiments.

environment:
  WANDB_MODE: "disabled"
  VBENCH_HOME: "/home/lab617/xuanli/work/PHM-Vibench"
  PYTHONPATH: "/home/lab617/miniconda3/envs/xuanli_phmbench"
  PHMBench: "/home/lab617/xuanli/work/PHM-Vibench"
  seed: 17

data:
  data_dir: "/home/lab617/xuanli/dataset/PHMbench_rawdata"
  metadata_file: "metadata_9_29.xlsx"
  batch_size: &tspn_shared_bs 64
  num_workers: 4
  train_ratio: 0.8
  normalization: 'standardization'
  window_size: 4096
  stride: 5
  truncate_lenth: 100
  dtype: float32
  num_window: 64

model:
  name: "TSPN"
  type: "X_model"
  device: cuda
  signal_processing_configs:
    layer1: ['LNO','WF','HT','I']
    layer2: ['LNO','WF','HT','I']
    layer3: ['LNO','WF','HT','I']
    layer4: ['LNO','WF','HT','I']
  feature_extractor_configs: ['Mean', 'Std', 'Var', 'Entropy','Max', 'Min', 'AbsMean', 'Kurtosis', 'RMS', 'CrestFactor','Skewness', 'ClearanceFactor', 'ShapeFactor']
  skip_connection: true
  num_classes: 9
  in_dim : 4096
  out_dim : 4096
  in_channels : 3
  out_channels : 4
  scale : 4
  f_c_mu: 0
  f_c_sigma: 0.1
  f_b_mu: 0
  f_b_sigma: 0.1
  contrastive:
    enabled: false
    projection_hidden: 512
    projection_dim: 128
    temperature: 0.1
    loss_weight: 0.0
    mode: "supervised"

task:
  name: "classification"
  type: 'DG'
  target_domain_id: [10]
  source_domain_id: [0,2,4,6,8] # [0,1,2,3,4]
  loss: "CE"
  metrics: ["acc"]
  target_system_id: [19]
  optimizer: "adam"
  regularization: {'flag': True, 'method': {'l1': 0.0001}}
  batch_size: *tspn_shared_bs
  num_workers: 4
  pin_memory: true
  shuffle: true
  log_interval: 10
  epochs: 100
  lr: 0.001
  weight_decay: 0.0005
  early_stopping: true
  es_patience: 5
  scheduler: true
  scheduler_type: "step"
  step_size: 3
  gamma: 0.5
  few_shot:
    enabled: false
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 2
    classes_per_domain: 3
    support_per_class: 5
    query_per_class: 15
    preserve_labels: true
    episodes_per_epoch: 200
    format: "flat"
  explainability:
    enabled: false
    output_subdir: "explainability"
    device: "auto"

trainer:
  name: "Default_trainer"
  wandb: true
  pruning: false
  num_epochs: 10
  gpus: 1
  early_stopping: true
  patience: 5
  device: 'cuda'
  logging:
    contrastive_metrics: false
