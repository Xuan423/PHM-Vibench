__include__:
  - base.yaml

environment:
  project: "tspn_fewshot_ottawa"
  output_dir: "results/tspn_fewshot_ottawa"
  notes: "Few-shot TSPN DG run targeting Ottawa 19 system 18 domain 4."
  iterations: 1
  swanlab: false

data:
  batch_size: &bs 32

model:
  name: "TSPNContrastive"
  in_channels: 2
  contrastive:
    enabled: true
    projection_hidden: 512
    projection_dim: 128
    temperature: &contrastive_temp 0.2
    loss_weight: &contrastive_loss_weight 0.2
    mode: "supervised"
  mining:
    strategy: "domain"

task:
  name: "contrastive_classification"
  target_system_id: [13]
  target_domain_id: [2,3]
  source_domain_id: [0,1]
  batch_size: *bs  # Per-iteration query cap for episodic batching
  epochs: &num_epoch 100
  lr: 0.002
  es_patience: &es_patience 50
  step_size: 5
  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 2
    classes_per_domain: 2
    support_per_class: 3
    query_per_class: 10
    preserve_labels: true
    episodes_per_epoch: 10
    warn_on_shortfall: true
  contrastive:
    temperature: *contrastive_temp
    loss_weight: *contrastive_loss_weight
    normalize_embeddings: true

trainer:
  name: "contrastive_trainer"
  num_epochs: *num_epoch
  patience: *es_patience
  logging:
    contrastive_metrics: true
  callbacks:
    checkpoint_monitor: "val_total_loss"
    checkpoint_mode: "min"
