__include__:
  - contrastive.yaml

environment:
  project: "tspn_fewshot_sdust"
  output_dir: "results/tspn_fewshot_sdust"
  notes: "Few-shot TSPN DG run targeting SDUST9."
  iterations: 1
  swanlab: false

model:
  num_classes: 10
  in_channels : 6
  contrastive:
    loss_weight: &contrastive_loss_weight 0.2

task:
  target_system_id: [21]
  target_domain_id: [37] #37
  source_domain_id: [0,4,9,13,17,21]
  few_shot:
    enabled: true
    sampler: "hierarchical"
    systems_per_episode: 1
    domains_per_episode: 4
    classes_per_domain: 6
    support_per_class: 3
    query_per_class: 10
    preserve_labels: true
    episodes_per_epoch: 30
    warn_on_shortfall: true
    format: "episode"

