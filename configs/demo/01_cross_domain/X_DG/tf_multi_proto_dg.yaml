# Canonical TF_MultiProtoDG mainline for the sys27/sys21 family.
# Default task entry is sys27 target-domain 0; taskset overrides expand to sys27
# T1/T2 and the full sys21 leave-one-out family.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tf_multi_proto_dg_sys27_sys21_family"
  seed: 42
  iterations: 5
  output_dir: "results/demo/tf_multi_proto_dg_sys27_sys21_family"
  notes: "Canonical TF_MultiProtoDG family for target_system_id 27/21 with domain-aligned multi-prototype defaults."

data:
  batch_size: 64
  num_workers: 4

task:
  target_system_id: [27]
  source_domain_id: [1,2]
  target_domain_id: [0]
  label_smoothing: 0.05
  lr: 0.001
  weight_decay: 0.001

model:
  name: "TF_MultiProtoDG"
  type: "X_model"
  device: "cuda"
  input_length: 4096
  time_operators: ["Identity", "FirstDifference", "DetrendMovingAverage", "HilbertEnvelope", "TKEO"]
  freq_operators: ["IdentitySpectrum", "LogSpectrum", "SpectralWhitening", "GaussianBandMask"]
  time_indicators: ["Mean", "Std", "RMS", "Kurtosis", "CrestFactor", "Entropy"]
  freq_indicators: ["BandEnergy", "BandRMS", "SpectralEntropy", "PeakRatio"]
  time_patch_count: 8
  freq_band_count: 8
  padding_mode: "zero_right"
  role_dim: 16
  num_prototypes_per_class: 3
  prototype_temperature: 0.12
  prototype_assignment_temperature: 0.12
  proto_contrastive_temperature: 0.3
  proto_contrastive_positive_mode: "assigned"
  proto_contrastive_weight: 0.08
  proto_contrastive_neg_topk: 0
  adaptive_proto_enabled: true
  adaptive_effective_k_enabled: false
  adaptive_effective_k_ready_count: 8.0
  adaptive_effective_k_min: 1
  adaptive_effective_k_penalty: 6.0
  contrastive_warmup_epochs: 0
  channel_fusion_norm: "layernorm"
  role_nonneg: "none"
  role_input_norm: "layernorm"
  role_output_norm: "none"
  cross_score_norm: "layernorm"
  cross_pool_mode: "logsumexp"
  cross_pool_tau: 0.6
  cross_self_mix: 0.18
  cross_self_score_mode: "absmean"
  concept_norm: "layernorm"
  prototype_logit_scale_init: 6.0
  prototype_diversity_weight: 0.005
  prototype_occupancy_weight: 0.005
  use_contrastive_head: true
  export_diagnostics: false
  prototype_class_pool_mode: "logsumexp"
  prototype_card_top_t: 8
  diagnostics_max_members: 32
  classifier:
    residual_input: "raw_feature"
    residual_weight: 0.18
    scale: 1.0

trainer:
  gpus: 1
  device: "cuda"
  num_epochs: 100
  patience: 50
  save_last: false
