# Canonical TF_MultiProtoDG mainline for the sys27/sys21 family.
# Default task entry is sys27 target-domain 0; taskset overrides expand to sys27
# T1/T2 and the full sys21 leave-one-out family.

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tf_multi_proto_dg_sys27_sys21_family"
  seed: 19
  iterations: 5
  # Optional: fix model parameter initialization across iterations while keeping
  # per-iteration data/sampler randomness (set null to disable).
  model_init_seed: null
  output_dir: "results/demo/tf_multi_proto_dg_sys27_sys21_family"
  notes: "TF_MultiProtoDG v4.1-restored clean-decision mainline: final logits use global class-anchor evidence only; local anomaly residual MLP remains as a training scaffold for the fused concept and prototype geometry. Local slot verification, local prototype routing, and local classifier branches stay disabled. No domain shortcut, no fixed model seed."

data:
  batch_size: 64
  num_workers: 4
  pin_memory: false
  # Stabilize early prototype bootstrap by avoiding extreme per-batch label skew.
  train_label_stratified: false
  train_label_stratified_epochs: 0
  label_metadata_key: "Label"

task:
  target_system_id: [27]
  source_domain_id: [1,0]
  target_domain_id: [2]
  label_smoothing: 0.05
  lr: 0.001
  weight_decay: 0.001

model:
  name: "TF_MultiProtoDG"
  type: "X_model"
  device: "cuda"
  input_length: 4096
  time_operators: ["Identity", "FirstDifference", "DetrendMovingAverage", "HilbertEnvelope", "TKEO"]
  freq_operators: ["IdentitySpectrum", "LogSpectrum", "SpectralWhitening", "GaussianBandMask"]
  time_indicators: ["Mean", "Std", "RMS", "Kurtosis", "CrestFactor", "Entropy"]
  freq_indicators: ["BandEnergy", "BandRMS", "SpectralEntropy", "PeakRatio"]
  time_patch_count: 64
  time_patch_mode: "random"
  time_patch_width: 512
  freq_band_count: 64
  freq_band_mode: "random"
  freq_band_width: 256
  region_sampling_mode: "global_random"
  region_sampling_seed_offset: 17
  padding_mode: "zero_right"
  transparent_backbone_enabled: true
  transparent_backbone_weight: 1.0
  transparent_backbone_deterministic_init: false
  transparent_time_dual_basis_enabled: true
  transparent_backbone_layers: 4
  transparent_backbone_modules: ["WF", "HT", "I"]
  transparent_backbone_features: ["Mean", "Std", "Entropy", "RMS", "Kurtosis", "CrestFactor", "AbsMean", "Skewness", "ClearanceFactor", "ShapeFactor"]
  transparent_backbone_freq_modules: ["IdentitySpectrum", "LogSpectrum", "SpectralWhitening", "GaussianBandMask"]
  transparent_backbone_freq_features: ["BandEnergy", "BandRMS", "SpectralEntropy", "PeakRatio"]
  transparent_backbone_feature_norm: "legacy_running"
  transparent_backbone_feature_norm_eps: 0.2
  transparent_projection_init_mode: "random_normal"
  structured_global_enabled: false
  role_dim: 16
  concept_dim: 64
  num_prototypes_per_class: 3
  prototype_temperature: 0.15
  prototype_assignment_temperature: 0.15
  prototype_class_pool_mode: "logsumexp"
  prototype_class_anchor_mode: "mean"
  prototype_anchor_input: "global"
  prototype_concept_input: "h"
  # Clean decision boundary: train/evaluate the public classifier with global
  # class-anchor logits. The fused h path remains available to the prototype
  # contrastive scaffold, but residual/local prototype evidence cannot vote.
  prototype_decision_output: "anchor_only"
  prototype_assignment_input: "concept"
  # Required by the v4.1-level sys27 formal runs: this residual stabilizes the
  # fused concept h, but local slot verification and local routing remain off.
  local_anomaly_residual_mode: "mlp"
  local_anomaly_gate_mode: "cross_focus"
  semantic_residual_init: "zero"
  prototype_residual_score_mode: "anchored_offset"
  prototype_residual_logit_weight: 1.0
  prototype_residual_logit_mode: "agreement"
  proto_contrastive_temperature: 0.3
  proto_contrastive_positive_mode: "softmax_expectation"
  use_contrastive_head: true
  # Sys27 formal setting recovered from the stable local-off 15-seed window.
  proto_contrastive_weight: 0.05
  proto_contrastive_use_scaled_scores: true
  contrastive_warmup_epochs: 10
  adaptive_proto_enabled: false
  prototype_residual_warmup_epochs: 10
  prototype:
    assignment_mode: "soft_balanced"
    balance_weight: 0.05
  role_init_mode: "random_normal"
  cross_pool_mode: "logsumexp"
  cross_pool_tau: 0.6
  cross_self_mix: 1.0
  cross_adaptive_self_mix: false
  prototype_logit_scale_init: 6.0
  prototype_init_mode: "deterministic_anchor"
  prototype_init_scale: 0.02
  cooperative_prototypes_enabled: false
  classifier:
    residual_input: "semantic_stats"
    residual_weight: 0.05
    residual_alignment_mode: "off"
    residual_init: "default"
    scale: 1.0
      
trainer:
  gpus: 1
  device: "cuda"
  monitor: "val_total_loss"
  num_epochs: 200
  patience: 100
  save_last: false
