# Unified multi-prototype candidate tuned for stable T2 behavior.
# Default entry uses sys27 T2. For T0/T1, only override:
#   task.target_system_id
#   task.source_domain_id
#   task.target_domain_id

pipeline: "Pipeline_01_default"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tf_multi_proto_dg_unified_rawres_k2_assigned"
  seed: 42
  iterations: 5
  output_dir: "results/demo/tf_multi_proto_dg_unified_rawres_k2_assigned"
  notes: "Unified candidate: raw residual + k=2 prototypes/class + assigned prototype contrastive. Default task is sys27 T2; override task.* for other leave-one-out evaluations."

data:
  batch_size: 64
  num_workers: 4

task:
  target_system_id: [27]
  source_domain_id: [1, 2]
  target_domain_id: [0]
  label_smoothing: 0.05
  weight_decay: 0.001

model:
  name: "TF_MultiProtoDG"
  type: "X_model"
  device: "cuda"
  input_length: 4096
  time_operators: ["Identity", "FirstDifference", "DetrendMovingAverage", "HilbertEnvelope", "TKEO"]
  freq_operators: ["IdentitySpectrum", "LogSpectrum", "SpectralWhitening", "GaussianBandMask"]
  time_indicators: ["Mean", "Std", "RMS", "Kurtosis", "CrestFactor", "Entropy"]
  freq_indicators: ["BandEnergy", "BandRMS", "SpectralEntropy", "PeakRatio"]
  time_patch_count: 8
  freq_band_count: 8
  padding_mode: "zero_right"
  role_dim: 16
  num_prototypes_per_class: 1
  prototype_temperature: 0.2
  prototype_assignment_temperature: 0.2
  proto_contrastive_temperature: 0.2
  proto_contrastive_positive_mode: "assigned"
  proto_contrastive_weight: 0.01
  proto_contrastive_neg_topk: 0
  adaptive_proto_enabled: false
  contrastive_warmup_epochs: 20
  channel_fusion_norm: "layernorm"
  role_nonneg: "none"
  role_input_norm: "layernorm"
  role_output_norm: "none"
  cross_score_norm: "layernorm"
  cross_pool_mode: "logsumexp"
  cross_pool_tau: 0.6
  cross_self_mix: 0.18
  cross_self_score_mode: "absmean"
  concept_norm: "layernorm"
  prototype_logit_scale_init: 6.0
  prototype_diversity_weight: 0.00
  prototype_occupancy_weight: 0.00
  use_contrastive_head: true
  export_diagnostics: false
  prototype_card_top_t: 8
  diagnostics_max_members: 32
  classifier:
    residual_input: "raw_feature"
    residual_weight: 0.18
    scale: 1.0

trainer:
  save_last: true
