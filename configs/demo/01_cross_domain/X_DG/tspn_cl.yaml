# TSPN-CL with concept head and optional contrastive/K-shot (DG demo)

pipeline: "Pipeline_TSPN_CL"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_tspn.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tspn_cl_dg"
  seed: 42
  output_dir: "results/demo/tspn_cl_dg"
  notes: "TSPN-CL concept head demo (DG)."

task:
  target_system_id: [17]
  source_domain_id: [0,1]
  target_domain_id: [2]

model:
  name: "TSPN_CL"
  type: "X_model"
  device: "cuda"
  # Metric head + stability Top-K (default fisher score, mask-based)
  use_contrastive_head: true
  top_k_features: 64
  concept_dim: 32
  temperature: 0.1
  lambda_cl_start: 0.05 #0.05
  lambda_cl_end: 0.4 #0.4
  topk_ema_momentum: 0.8

  # Stage 2 K-shot calibration (imprint on the same classifier head; optional metric tuning)
  stage2_enable: true
  stage2_k_shot: 10
  stage2_mode: "imprint"
  stage2_tune_metric: true
  stage2_steps: 100
  stage2_lr_scale: 0.1          # actual lr = task.lr * lr_scale
  stage2_lambda_prox: 0.001     # proximal constraint on metric head (V)
  stage2_imprint_fusion: true
  stage2_proto_n0: 10
  stage2_use_temperature: true
  stage2_temperature_init: 0.8

  # Sparsity (optional, Stage1 config; Stage2 inherits)
  sparsity_enable: true
  sparsity_start_ratio: 0.25
  sparsity_coeff_row: 0.001
  sparsity_coeff_col: 0.0001
