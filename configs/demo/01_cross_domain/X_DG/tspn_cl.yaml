# TSPN-CL with concept head and optional contrastive/K-shot (DG demo)

pipeline: "Pipeline_TSPN_CL"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_tspn.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tspn_cl_dg"
  seed: 42
  output_dir: "results/demo/tspn_cl_dg"
  notes: "TSPN-CL concept head demo (DG)."

task:
  target_system_id: [21]
  source_domain_id: [1, 5, 10, 14]
  target_domain_id: [30]
  nan_debug: true

model:
  name: "TSPN_CL"
  type: "X_model"
  device: "cuda"

  # Concept head / stability top-K / contrastive
  use_physical_concept_head: true
  use_contrastive_head: true
  top_k_features: 208
  concept_dim: 128
  temperature: 0.1
  lambda_contrastive: 0.0
  lambda_phys_consistency: 0.2
  topk_score_mode: "fisher_over_domain_var"
  topk_ema_momentum: 0.99
  topk_warmup_epochs: 30

  # Stage 2 K-shot calibration
  stage2_enable: true
  stage2_k_shot: 10
  stage2_freeze_backbone: true
  stage2_finetune_classifier: true
  prototype_metric: "cosine"
