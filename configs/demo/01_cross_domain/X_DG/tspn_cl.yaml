# TSPN-CL with concept head and optional contrastive/K-shot (DG demo)

pipeline: "Pipeline_TSPN_CL"

base_configs:
  environment: "configs/base/environment/base.yaml"
  data: "configs/base/data/base_cross_domain.yaml"
  model: "configs/base/model/backbone_tspn.yaml"
  task: "configs/base/task/dg.yaml"
  trainer: "configs/base/trainer/default_single_gpu.yaml"

environment:
  project: "demo_tspn_cl_dg"
  seed: 17
  output_dir: "results/demo/tspn_cl_dg"
  notes: "TSPN-CL concept head demo (DG)."

task:
  target_system_id: [19]
  source_domain_id: [2, 4, 6, 8]
  target_domain_id: [10]

model:
  name: "TSPN_CL"
  type: "X_model"
  device: "cuda"
  in_channels: 3
  # Concept head / stability top-K / contrastive
  use_physical_concept_head: false
  use_contrastive_head: true
  topk_mode: "score"          # default: keep order; set to "score" to enable fisher scoring
  top_k_features: 64            # used when score mode or slicing
  score_mode: "fisher_over_domain_var"
  concept_dim: 32
  projector_mode: "softmax"  # default bypass/linear; set "softmax" if needed
  temperature: 0.07
  lambda_cl_start: 0.05
  lambda_cl_end: 0.5
  lambda_cl_schedule: "linear"
  lambda_phys_consistency: 0.5
  topk_ema_momentum: 0.8

  # Stage 2 K-shot calibration
  stage2_enable: true
  stage2_k_shot: 10
  stage2_freeze_backbone: true
  stage2_finetune_classifier: true
  prototype_metric: "cosine"

  # Metric head & sparsity (optional)
  metric_head: true
  sparsity_enable: true
  sparsity_start_ratio: 0.25
  sparsity_coeff_row: 0.001
  sparsity_coeff_col: 0.0001
