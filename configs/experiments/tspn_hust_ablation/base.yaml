# Base configuration for TSPN HUST ablation studies.
#
# Imports the demo contrastive few-shot configuration (already configured with
# environment.iterations = 5) and overrides experiment metadata so ablation
# runs are isolated under a dedicated project/output namespace.

__include__:
  - ../../demo/X_Single_DG/TSPN_FewShot/contrastive.yaml

environment:
  project: "tspn_hust_ablation"
  output_dir: "results/tspn_hust_ablation"
  notes: "HUST ablation suite derived from demo contrastive config."
  iterations: 5

task:
  metadata:
    dataset: "HUST"
    variant_label: "full"
    variant_type: "contrastive_full"
    episode_enabled: true
    support_alignment: true
    active_branches: "support_support,support_query,query_query"
  contrastive:
    active_branches:
      - support_support
      - support_query
      - query_query
    weighting:
      strategy: "uniform"
