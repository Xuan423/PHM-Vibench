study:
  type: "hparam"
  name: "tf_multi_proto_dg_batch_hparam_core"
  base_config: "configs/demo/01_cross_domain/X_DG/tf_multi_proto_dg.yaml"
  output_dir: "results/experiments/tf_multi_proto_dg_batch/hparam"
  summary:
    export_markdown: true
    export_csv: true

execution:
  iterations: 5
  default_num_epochs: 100
  smoke_iterations: 1
  smoke_num_epochs: 1
  smoke_num_workers: 0
  diagnostics_extract: true
  continue_on_error: true

grid:
  model.proto_contrastive_weight: [0.05, 0.08, 0.1, 0.2]
  model.proto_contrastive_temperature: [0.1, 0.2, 0.3, 0.4]
  task.label_smoothing: [0.02, 0.05, 0.08]
