study:
  type: "ablation"
  name: "tf_multi_proto_dg_batch_ablation"
  base_config: "configs/demo/01_cross_domain/X_DG/tf_multi_proto_dg.yaml"
  output_dir: "results/experiments/tf_multi_proto_dg_batch/ablation"
  summary:
    export_markdown: true
    export_csv: true

execution:
  iterations: 5
  default_num_epochs: 100
  smoke_iterations: 1
  smoke_num_epochs: 1
  smoke_num_workers: 0
  diagnostics_extract: true
  continue_on_error: true

variants:
  - variant_id: "full_model"
    group: "baseline"
    description: "Full TF_MultiProtoDG mainline with both branches, residual fusion, and multi-prototype contrastive learning."
    diagnostics_expected: false
    overrides:
      model.ablation.enabled: false
      model.export_diagnostics: false

  - variant_id: "time_only"
    group: "branch"
    description: "Time branch only with CE supervision; frequency branch and prototype-related auxiliary learning are disabled."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "time_only"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 0.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.readability_scale: 0.0
      model.ablation.loss_control.complementarity_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: false
      model.ablation.loss_control.prototype_update_enabled: false
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "freq_only"
    group: "branch"
    description: "Frequency branch only with CE supervision; time branch and prototype-related auxiliary learning are disabled."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "freq_only"
      model.ablation.branch_masks.time: 0.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.readability_scale: 0.0
      model.ablation.loss_control.complementarity_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: false
      model.ablation.loss_control.prototype_update_enabled: false
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "tf_only_ce"
    group: "objective"
    description: "Both time and frequency branches remain active, but only CE supervision stays on."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "tf_only_ce"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.readability_scale: 0.0
      model.ablation.loss_control.complementarity_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: false
      model.ablation.loss_control.prototype_update_enabled: false
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "tf_single_prototype_with_contrast"
    group: "prototype"
    description: "Both branches stay active and contrastive learning is preserved, but each class uses a single prototype."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.num_prototypes_per_class: 1
      model.ablation.enabled: true
      model.ablation.variant_id: "tf_single_prototype_with_contrast"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 1.0
      model.ablation.loss_control.prototype_assignment_enabled: true
      model.ablation.loss_control.prototype_update_enabled: true
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "no_residual_fusion"
    group: "fusion"
    description: "Full TF_MultiProtoDG mainline with classifier residual fusion removed."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: false
      model.classifier.residual_weight: 0.0
