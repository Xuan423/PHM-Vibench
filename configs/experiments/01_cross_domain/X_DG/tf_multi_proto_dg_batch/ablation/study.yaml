study:
  type: "ablation"
  name: "tf_multi_proto_dg_batch_ablation"
  base_config: "configs/demo/01_cross_domain/X_DG/tf_multi_proto_dg.yaml"
  output_dir: "results/experiments/tf_multi_proto_dg_batch/ablation"
  summary:
    export_markdown: true
    export_csv: true

execution:
  iterations: 5
  default_num_epochs: 100
  smoke_iterations: 1
  smoke_num_epochs: 1
  smoke_num_workers: 0
  diagnostics_extract: true
  continue_on_error: true

variants:
  - variant_id: "baseline_full"
    group: "baseline"
    description: "Full T+F interpretable model with multi-prototype contrastive learning."
    diagnostics_expected: false
    overrides:
      model.ablation.enabled: false
      model.export_diagnostics: false

  - variant_id: "branch_time_only_ce"
    group: "branch"
    description: "Only the time branch remains active; CE-only supervision."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "branch_time_only_ce"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 0.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.readability_scale: 0.0
      model.ablation.loss_control.complementarity_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: false
      model.ablation.loss_control.prototype_update_enabled: false
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "branch_freq_only_ce"
    group: "branch"
    description: "Only the frequency branch remains active; CE-only supervision."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "branch_freq_only_ce"
      model.ablation.branch_masks.time: 0.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.readability_scale: 0.0
      model.ablation.loss_control.complementarity_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: false
      model.ablation.loss_control.prototype_update_enabled: false
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "proto_single_with_contrast"
    group: "prototype"
    description: "Single prototype per class with contrastive learning preserved."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.num_prototypes_per_class: 1
      model.ablation.enabled: true
      model.ablation.variant_id: "proto_single_with_contrast"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 1.0
      model.ablation.loss_control.prototype_assignment_enabled: true
      model.ablation.loss_control.prototype_update_enabled: true
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "proto_multi_no_contrast"
    group: "prototype"
    description: "Multi-prototype state remains active, but the contrastive contribution is zeroed out."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.num_prototypes_per_class: 4
      model.ablation.enabled: true
      model.ablation.variant_id: "proto_multi_no_contrast"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.loss_control.contrastive_scale: 0.0
      model.ablation.loss_control.prototype_assignment_enabled: true
      model.ablation.loss_control.prototype_update_enabled: true
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "ops_basic_only"
    group: "operator"
    description: "Keep only Identity and IdentitySpectrum while preserving the canonical feature layout."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "ops_basic_only"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.operator_masks.time.Identity: 1.0
      model.ablation.operator_masks.time.FirstDifference: 0.0
      model.ablation.operator_masks.time.DetrendMovingAverage: 0.0
      model.ablation.operator_masks.time.HilbertEnvelope: 0.0
      model.ablation.operator_masks.time.TKEO: 0.0
      model.ablation.operator_masks.freq.IdentitySpectrum: 1.0
      model.ablation.operator_masks.freq.LogSpectrum: 0.0
      model.ablation.operator_masks.freq.SpectralWhitening: 0.0
      model.ablation.operator_masks.freq.GaussianBandMask: 0.0
      model.ablation.loss_control.contrastive_scale: 1.0
      model.ablation.loss_control.prototype_assignment_enabled: true
      model.ablation.loss_control.prototype_update_enabled: true
      model.ablation.loss_control.diagnostics_enabled: false

  - variant_id: "indicators_basic_only"
    group: "indicator"
    description: "Keep only Mean and BandEnergy while preserving the canonical feature layout."
    diagnostics_expected: false
    overrides:
      model.export_diagnostics: false
      model.ablation.enabled: true
      model.ablation.variant_id: "indicators_basic_only"
      model.ablation.branch_masks.time: 1.0
      model.ablation.branch_masks.freq: 1.0
      model.ablation.indicator_masks.time.Mean: 1.0
      model.ablation.indicator_masks.time.Std: 0.0
      model.ablation.indicator_masks.time.RMS: 0.0
      model.ablation.indicator_masks.time.Kurtosis: 0.0
      model.ablation.indicator_masks.time.CrestFactor: 0.0
      model.ablation.indicator_masks.time.Entropy: 0.0
      model.ablation.indicator_masks.freq.BandEnergy: 1.0
      model.ablation.indicator_masks.freq.BandRMS: 0.0
      model.ablation.indicator_masks.freq.SpectralEntropy: 0.0
      model.ablation.indicator_masks.freq.PeakRatio: 0.0
      model.ablation.loss_control.contrastive_scale: 1.0
      model.ablation.loss_control.prototype_assignment_enabled: true
      model.ablation.loss_control.prototype_update_enabled: true
      model.ablation.loss_control.diagnostics_enabled: false
