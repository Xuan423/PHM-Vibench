taskset:
  name: "tfmpdg_sys13_t3_debug"
  description: "Canonical single-task debug preset for the sys13 family."
  tasks:
    - task_id: "sys13_t3_debug"
      description: "Debug preset: source domains 0, 1, and 2 -> target domain 3 under the sys13 family defaults."
      target_system_id: [13]
      source_domain_id: [0, 1, 2]
      target_domain_id: [3]
      overrides:
        task.label_smoothing: 0.08
        task.lr: 0.01
        task.weight_decay: 0.0001
        trainer.num_epochs: 100
        trainer.patience: 50
        model.proto_contrastive_weight: 0.05
        model.proto_contrastive_temperature: 0.3
        model.num_prototypes_per_class: 4
