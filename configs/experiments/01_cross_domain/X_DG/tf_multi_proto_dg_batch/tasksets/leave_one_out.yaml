taskset:
  name: "tfmpdg_sys21_leave_one_out"
  description: "Canonical leave-one-domain-out task family for target_system_id 21."
  tasks:
    - task_id: "sys21_t14"
      description: "Target domain 14 with source domains 16, 22, and 24 under the sys21 family defaults."
      target_system_id: [21]
      source_domain_id: [16, 22, 24]
      target_domain_id: [14]
      overrides:
        task.label_smoothing: 0.05
        task.lr: 0.001
        task.weight_decay: 0.001
        trainer.num_epochs: 100
        trainer.patience: 50
        model.proto_contrastive_weight: 0.08
