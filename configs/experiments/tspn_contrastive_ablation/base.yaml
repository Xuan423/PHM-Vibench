# Shared base configuration for unified contrastive ablation suites.
#
# Imports the demo contrastive few-shot configuration, enforcing uniform
# weighting and consistent experiment metadata. Dataset-specific files should
# inherit from this base and override only what is necessary.

__include__:
  - ../../demo/X_Single_DG/TSPN_FewShot/contrastive.yaml

environment:
  project: "tspn_contrastive_ablation"
  output_dir: "results/tspn_contrastive_ablation"
  notes: "Unified contrastive ablation baseline."
  iterations: 5

task:
  metadata:
    suite: "contrastive_ablation"
    variant_label: "full"
    branch_controller: "uniform_positive_count"
  contrastive:
    weighting:
      strategy: "uniform"
    branches:
      support_support:
        enabled: true
        participates: true
      support_query:
        enabled: true
        participates: true
      query_query:
        enabled: true
        participates: true
