# Minimal configuration for CI smoke tests and quick validations.

__include__:
  - base_import.yaml

environment:
  project: "tspn_debug_single_run"
  notes: "Debug sweep config for rapid testing."
  iterations: 1

model:
  contrastive:
    enabled: false

task:
  epochs: 1
  few_shot:
    enabled: false
  contrastive:
    loss_weight: 0.0
    temperature: 0.1

trainer:
  logging:
    contrastive_metrics: false
  num_epochs: 1
