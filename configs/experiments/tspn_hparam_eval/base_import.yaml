# Base configuration for TSPN hyperparameter evaluation sweeps.
#
# The file imports the shared TSPN defaults and pins metadata shared across
# all sweep families. Individual sweep definitions supply additional
# overrides via the orchestration utilities under script/hparam_eval/.

__include__:
  - ../../demo/X_Single_DG/TSPN_FewShot/contrastive.yaml

environment:
  project: "tspn_contrastive_sweep"
  output_dir: "results/tspn_contrastive_sweep"
  notes: "Base config for contrastive few-shot hyperparameter sweep."
  iterations: 1
