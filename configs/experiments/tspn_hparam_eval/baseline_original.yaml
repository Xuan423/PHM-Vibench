# Canonical TSPN configuration without contrastive or few-shot augmentations.

__include__:
  - base_import.yaml

environment:
  project: "tspn_baseline_original"
  output_dir: "results/tspn_baseline_original"
  notes: "Legacy TSPN run without contrastive or episodic components."

model:
  name: "TSPN"
  contrastive:
    enabled: false
    loss_weight: 0.0
    temperature: 0.1

task:
  name: "classification"
  few_shot:
    enabled: false
  contrastive:
    loss_weight: 0.0
    temperature: 0.1
  scheduler: null
  optimizer: "adam"
  lr: 0.001
  weight_decay: 0.0001
  epochs: 100

trainer:
  name: "Default_trainer"
  logging:
    contrastive_metrics: false
